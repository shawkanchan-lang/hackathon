<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Auto-Captions</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; line-height: 1.6; }
        .container { border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
        .result-box { background: #f4f4f4; padding: 15px; margin-top: 20px; border-left: 5px solid #333; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Upload Video for Auto-Captions</h2>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="video" accept="video/*" required>
            <br><br>
            <button type="submit">Generate Captions</button>
        </form>

        {% if captions %}
        <div class="result-box">
            <h3>Generated Transcription:</h3>
            <p>{{ captions }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
